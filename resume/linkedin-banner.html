<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LinkedIn Banner — Nishil Bhave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #09090b;
    overflow: hidden;
  }
  body {
    width: 1584px;
    height: 396px;
  }
  svg { display: block; }
  text { white-space: pre; }
</style>
</head>
<body>

<svg width="1584" height="396" viewBox="0 0 1584 396" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- subtle grid pattern -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1c1c20" stroke-width="0.5"/>
    </pattern>

    <!-- lime glow on left -->
    <radialGradient id="glow-lime" cx="18%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#D9F99D" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#D9F99D" stop-opacity="0"/>
    </radialGradient>

    <!-- purple glow on right -->
    <radialGradient id="glow-purple" cx="82%" cy="55%" r="32%">
      <stop offset="0%" stop-color="#E9D5FF" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#E9D5FF" stop-opacity="0"/>
    </radialGradient>

    <!-- vignette to focus attention center -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <!-- base layers -->
  <rect width="1584" height="396" fill="#09090b"/>
  <rect width="1584" height="396" fill="url(#grid)"/>
  <rect width="1584" height="396" fill="url(#glow-lime)"/>
  <rect width="1584" height="396" fill="url(#glow-purple)"/>
  <rect width="1584" height="396" fill="url(#vignette)"/>

  <!-- top-right: status badge -->
  <g transform="translate(1378, 56)">
    <circle cx="0" cy="0" r="4" fill="#D9F99D"/>
    <text x="14" y="4"
          font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
          font-size="11"
          font-weight="500"
          fill="#D9F99D"
          letter-spacing="2.5">BOOKING Q3 2026</text>
  </g>

  <!-- main content block -->
  <g transform="translate(420, 130)">
    <!-- eyebrow -->
    <text x="0" y="0"
          font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
          font-size="12"
          font-weight="500"
          fill="#71717a"
          letter-spacing="3.5">AI-NATIVE  ·  SENIOR BUILDER  ·  MUMBAI / REMOTE</text>

    <!-- headline line 1 -->
    <text x="0" y="58"
          font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif"
          font-weight="700"
          font-size="48"
          fill="#fafafa"
          letter-spacing="-1.2">Senior Software Engineer.</text>

    <!-- headline line 2, with lime emphasis on the verb -->
    <text x="0" y="116"
          font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif"
          font-weight="700"
          font-size="48"
          letter-spacing="-1.2"><tspan fill="#fafafa">Building </tspan><tspan fill="#D9F99D">AI in production</tspan><tspan fill="#fafafa">.</tspan></text>

    <!-- subline / proof strip -->
    <text x="0" y="174"
          font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif"
          font-weight="400"
          font-size="16"
          fill="#a1a1aa">
      <tspan>Sivon HQ</tspan><tspan fill="#3f3f46" dx="14">·</tspan><tspan dx="14">29 agents in production</tspan><tspan fill="#3f3f46" dx="14">·</tspan><tspan dx="14">7 engines</tspan><tspan fill="#3f3f46" dx="14">·</tspan><tspan dx="14">11 years shipping production systems</tspan>
    </text>
  </g>

  <!-- bottom-right: portfolio URL -->
  <text x="1530" y="358"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="11"
        fill="#52525b"
        letter-spacing="1.5"
        text-anchor="end">nishilbhave.github.io</text>

</svg>

</body>
</html>
